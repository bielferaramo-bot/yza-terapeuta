<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="380" height="72">
  <defs>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B63" />
      <stop offset="40%" stop-color="#DFBF8E" />
      <stop offset="100%" stop-color="#A07840" />
    </linearGradient>
    <linearGradient id="softHalo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7ECE4" />
      <stop offset="100%" stop-color="#EBD5C8" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#8C4E36" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sacred Geometry / Therapeutic Monogram Icon -->
  <g transform="translate(4, 4)">
    <!-- Soft circular aura -->
    <circle cx="32" cy="32" r="30" fill="url(#softHalo)" opacity="0.65" />
    <!-- Fine dashed orbital ring -->
    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />
    
    <!-- Sacred Triangle / Systemic Pyramid -->
    <path d="M32 14 L50 46 L14 46 Z" fill="none" stroke="url(#goldLuxury)" stroke-width="1.8" stroke-linejoin="round" />
    
    <!-- Inner upward consciousness petal -->
    <path d="M32 20 C36 27 42 34 32 43 C22 34 28 27 32 20 Z" fill="url(#goldLuxury)" opacity="0.25" />
    <path d="M32 20 C36 27 42 34 32 43 C22 34 28 27 32 20 Z" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" />

    <!-- Center point (Source / Present moment) -->
    <circle cx="32" cy="35" r="2.6" fill="url(#goldLuxury)" />
    
    <!-- Horizon Line of Belonging -->
    <line x1="20" y1="46" x2="44" y2="46" stroke="url(#goldLuxury)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- High-End Typography -->
  <g transform="translate(80, 0)">
    <!-- Main Name -->
    <text x="0" y="38" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="3.5" fill="#2C2420">
      YZA
    </text>
    <text x="86" y="38" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="400" letter-spacing="5" fill="#756256">
      TERAPEUTA
    </text>
    
    <!-- Subtitle descriptor -->
    <text x="2" y="56" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#9B8578">
      CONSTELAÇÃO SISTÊMICA &amp; ENERGIA
    </text>
  </g>
</svg>
